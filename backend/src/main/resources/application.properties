server.port=8999
spring.application.name=NoteBookApp
spring.profiles.active=nas
# Primary DataSource (MySQL)
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/notesdb
spring.datasource.username=mysqluser
spring.datasource.password=password@123
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
# Backup DataSource (H2)
backup.db.enabled=false
spring.datasource.backup.url=jdbc:h2:file:./backup_h2_db;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.backup.driver-class-name=org.h2.Driver
# Serve static resources from external folder
spring.web.resources.static-locations=file:./static/,classpath:/static/
spring.threads.virtual.enabled=true
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/xml,text/plain
#for reverse proxy setup
server.forward-headers-strategy=native
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
spring.jpa.properties.hibernate.generate_statistics=false
spring.datasource.hikari.maximum-pool-size=4
spring.main.lazy-initialization=true