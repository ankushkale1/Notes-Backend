<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notebook App</title>

    <link href="css/noty.css" rel="stylesheet">
    <link href="css/topnav.css" rel="stylesheet">
    <link href="css/all.min.css" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <link href="css/magnific-popup.css" rel="stylesheet">
    <link href="css/page.css" rel="stylesheet">
    <link rel="stylesheet" href="css/balloon.min.css">
    <link rel="stylesheet" href="css/default.min.css">

    <style>
        /* Premium Monochrome Dark Theme - Pure Blacks & Grays */
        :root {
            --bg-main: #0a0a0a;
            --bg-surface: #141414;
            --bg-hover: #262626;
            --border-color: #262626;
            --border-focus: #525252;
            --text-main: #ededed;
            --text-muted: #888888;
            --accent: #ffffff;
            --btn-primary: #262626;
            --btn-hover: #404040;
            --delete-hover: #ff4c4c;
        }

        body, html {
            background-color: var(--bg-main) !important;
            color: var(--text-main) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* --- Global Loader Overlay --- */
        #app-loader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(10, 10, 10, 0.85);
            z-index: 9999;
            display: none;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
        }
        .loader-content { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 15px; }

        /* --- Top Navbar --- */
        .navbar-primary {
            background-color: var(--bg-surface) !important;
            border-bottom: 1px solid var(--border-color) !important;
            position: fixed !important;
            top: 0; left: 0;
            z-index: 1050 !important;
            margin: 0 !important;
            width: 100%;
            height: 50px !important;
            border-radius: 0;
            display: flex;
            align-items: center;
        }
        .navbar-primary .container-fluid {
            display: flex; justify-content: space-between; align-items: center; width: 100%; padding: 0 20px;
        }
        .navbar-nav { display: flex !important; flex-direction: row !important; align-items: center; margin: 0; padding: 0; list-style: none; height: 100%; }
        .navbar-nav > li { margin-left: 5px; display: flex; align-items: center; position: relative; }
        .navbar-inverse .navbar-nav > li > a {
            color: var(--text-muted) !important;
            display: flex; align-items: center; gap: 8px;
            transition: all 0.2s ease;
            border-radius: 6px; padding: 8px 12px !important;
            text-decoration: none; cursor: pointer;
        }
        .navbar-inverse .navbar-nav > li > a:hover {
            color: var(--accent) !important; background-color: var(--bg-hover) !important;
        }

        /* Sidebar Toggle Button in Nav */
        #sidebarToggle {
            background: transparent !important; border: none !important; color: var(--text-muted) !important;
            padding: 8px !important; margin: 0; border-radius: 4px; transition: all 0.2s; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }
        #sidebarToggle:hover { color: var(--accent) !important; background-color: var(--bg-hover) !important; }

        /* Dynamic Hamburger Icon - Changes to an expand icon when collapsed */
        body.sidebar-collapsed #sidebarToggle i::before {
            content: "\f03c"; /* fa-indent */
        }

        /* --- Modern Sidebar Architecture --- */
        .modern-sidebar {
            position: fixed;
            top: 50px; left: 0;
            width: 260px;
            height: calc(100vh - 50px);
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            overflow-y: auto; z-index: 1040;
            display: flex; flex-direction: column;
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Sidebar Collapsed State */
        body.sidebar-collapsed .modern-sidebar {
            transform: translateX(-260px);
        }

        .sidebar-header {
            padding: 15px 20px; font-size: 13px; font-weight: 600;
            color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; flex-shrink: 0;
        }

        #sidebarClose {
            cursor: pointer; padding: 5px; transition: color 0.2s; font-size: 14px;
        }
        #sidebarClose:hover { color: var(--accent); }

        .sidebar-menu { flex-grow: 1; padding: 10px 0; }
        .sidebar-menu ul { list-style: none; padding: 0; margin: 0; }

        /* Level 1 Category */
        .folder-item > a {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 20px; color: var(--text-muted) !important;
            text-decoration: none !important; font-size: 14px; font-weight: 500;
            transition: all 0.2s ease; border-left: 3px solid transparent; cursor: pointer;
        }
        .folder-item:hover > a, .folder-item.active > a {
            background-color: var(--bg-hover); color: var(--accent) !important;
        }
        .folder-item > a .menu-item-content { display: flex; align-items: center; gap: 12px; }
        .folder-item > a i.fa-folder-open { font-size: 14px; width: 16px; text-align: center; }

        /* Level 2 Nodes */
        .sub-menu { background-color: var(--bg-main); }
        .sub-menu li > a {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px 10px 45px; color: var(--text-muted) !important;
            text-decoration: none !important; font-size: 13px;
            transition: all 0.2s ease; border-left: 3px solid transparent; cursor: pointer;
        }
        .sub-menu li > a .menu-item-content { display: flex; align-items: center; gap: 10px; }
        .sub-menu li > a i.fa-file-lines { width: 14px; text-align: center; }
        .sub-menu li:hover > a, .sub-menu li.active > a {
            background-color: var(--bg-hover); color: var(--accent) !important;
        }
        .sub-menu li.active > a {
            border-left: 3px solid var(--accent); padding-left: 42px;
        }

        .fa-trash { transition: color 0.2s ease; font-size: 14px; }
        .fa-trash:hover { color: var(--delete-hover) !important; }

        /* --- Main Content Area --- */
        .main {
            margin-top: 50px;
            margin-left: 260px;
            padding: 30px;
            min-height: calc(100vh - 50px);
            box-sizing: border-box;
            transition: margin-left 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* Main Content Expanded State */
        body.sidebar-collapsed .main {
            margin-left: 0;
        }

        /* --- Modals & Popups --- */
        .white-popup {
            background: var(--bg-surface) !important;
            padding: 30px; border-radius: 8px; max-width: 400px; margin: 0 auto;
            color: var(--text-main) !important; border: 1px solid var(--border-color) !important;
        }
        .white-popup input[type="text"], .white-popup select {
            background-color: var(--bg-main) !important; color: var(--text-main) !important;
            border: 1px solid var(--border-color) !important;
            width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 4px;
        }
        .white-popup input[type="text"]:focus, .white-popup select:focus {
            border-color: var(--border-focus) !important; outline: none;
        }

        /* --- Buttons --- */
        button {
            background-color: var(--btn-primary) !important; color: var(--text-main) !important;
            border: 1px solid var(--border-color) !important;
            padding: 8px 16px; border-radius: 4px; font-weight: 500; cursor: pointer; transition: 0.2s ease;
            display: inline-flex; align-items: center; gap: 8px;
        }
        button:hover { background-color: var(--bg-hover) !important; color: var(--accent) !important; }

        /* --- Quill Editor UI --- */
        #editor {
            background-color: var(--bg-main) !important; color: var(--text-main) !important;
            border: 1px solid var(--border-color) !important; border-top: none !important;
            border-radius: 0 0 8px 8px; min-height: calc(100vh - 170px); font-size: 16px;
        }
        .ql-toolbar.ql-snow {
            background-color: var(--bg-surface) !important; border: 1px solid var(--border-color) !important;
            border-radius: 8px 8px 0 0; position: sticky; top: 50px; z-index: 1000; padding: 10px !important;
        }
        .ql-snow .ql-stroke { stroke: var(--text-muted) !important; }
        .ql-snow .ql-fill { fill: var(--text-muted) !important; }
        .ql-snow .ql-picker { color: var(--text-muted) !important; }
        button.ql-active .ql-stroke, .ql-snow .ql-picker-label:hover .ql-stroke, .ql-snow .ql-picker-item:hover .ql-stroke { stroke: var(--accent) !important; }
        button.ql-active .ql-fill, .ql-snow .ql-picker-label:hover .ql-fill, .ql-snow .ql-picker-item:hover .ql-fill { fill: var(--accent) !important; }
        .ql-snow .ql-picker-options { background-color: var(--bg-surface) !important; border-color: var(--border-color) !important; }

        .dropdown-menu { background-color: var(--bg-surface) !important; border: 1px solid var(--border-color) !important; }
        .dropdown-menu > li > a { color: var(--text-muted) !important; }
        .dropdown-menu > li > a:hover { background-color: var(--bg-hover) !important; color: var(--accent) !important; }
    </style>

    <script src="js/jquery-3.4.0.min.js"></script>
    <script src="js/highlight.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

    <script src="js/ui.js"></script>
    <script src="js/page.js"></script>
    <script src="js/topbar.js"></script>
    <script src="js/uri.js"></script>
    <script src="js/jquery.magnific-popup.min.js"></script>
    <script src="js/image-drop.min.js"></script>
    <script src="js/magic_url.js"></script>
    <script src="js/noty.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/turndown@7.1.1/dist/turndown.min.js"></script>
</head>

<body>

<div id="app-loader">
    <div class="loader-content">
        <i class="fa fa-spinner fa-spin fa-3x fa-fw"></i>
        <h4 id="loader-text">Loading...</h4>
    </div>
</div>

<nav class="navbar navbar-inverse navbar-primary">
    <div class="container-fluid">
        <div style="display: flex; align-items: center; gap: 15px;">
            <button type="button" id="sidebarToggle" title="Toggle Sidebar" onclick="document.body.classList.toggle('sidebar-collapsed')">
                <i class="fa fa-bars fa-lg"></i>
            </button>
            <div style="display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 500;">
                <label id="currentNotebook" style="margin: 0;">Notebook</label>
                <i class="fa fa-chevron-right" style="font-size: 12px; color: var(--text-muted);"></i>
                <label id="notename" style="margin: 0; color: var(--accent);">My Note</label>
            </div>
        </div>

        <ul class="nav navbar-nav navbar-right">
            <li><a aria-label="Refresh" data-balloon-pos="down" onclick="getNoteBookMeta()" role="button"><i class="fa fa-refresh"></i> <span class="hidden-xs">Refresh</span></a></li>
            <li><a aria-label="New Note" data-balloon-pos="down" href="#NewNote" class="mypopup" role="button"><i class="fa fa-file-circle-plus"></i> <span class="hidden-xs">New Note</span></a></li>
            <li><a aria-label="New Notebook" data-balloon-pos="down" href="#NewBook" class="mypopup" role="button"><i class="fa fa-folder-plus"></i> <span class="hidden-xs">New Notebook</span></a></li>
            <li><a aria-label="Save" data-balloon-pos="down" onclick="addUpdateNote()" role="button"><i class="fa fa-save"></i> <span class="hidden-xs">Save</span></a></li>
            <li><a aria-label="Export to Markdown" data-balloon-pos="down" onclick="exportToMarkdown()" role="button"><i class="fa-solid fa-file-export"></i> <span class="hidden-xs">Export</span></a></li>
            <li><a aria-label="Search" data-balloon-pos="down" href="#search" onclick="clearPrevSearch()" class="mypopup" role="button"><i class="fa fa-search"></i> <span class="hidden-xs">Search</span></a></li>
        </ul>
    </div>
</nav>

<aside class="modern-sidebar">
    <div class="sidebar-header">
        <div style="display: flex; align-items: center; gap: 10px;">
            <i class="fa fa-book-journal-whills"></i> Library
        </div>
        <i class="fa fa-chevron-left" id="sidebarClose" title="Collapse Sidebar" onclick="document.body.classList.toggle('sidebar-collapsed')"></i>
    </div>
    <div class="sidebar-menu">
        <ul id="menu-content" class="collapse in d-md-block"></ul>
    </div>
</aside>

<div style="display: none;">
    <div id="NewBook" class="white-popup mfp-hide">
        <h4 style="margin-top: 0; margin-bottom: 20px;">Create Notebook</h4>
        <input type="text" name="book" placeholder="Notebook Name"/>
        <select class="mynotebooks"></select>
        <button onclick="addNotebook($('[name=\'book\']').val(),$('#NewBook .mynotebooks').find(':selected').val())" style="width: 100%; justify-content: center;"><i class="fa fa-plus"></i> Create</button>
    </div>

    <div id="search" class="white-popup mfp-hide">
        <h4 style="margin-top: 0; margin-bottom: 20px;">Search Notes</h4>
        <input type="text" name="stxt" placeholder="Type to search..." onkeypress="search()"/>
        <div id="search-content"></div>
    </div>

    <div id="NewNote" class="white-popup mfp-hide">
        <h4 style="margin-top: 0; margin-bottom: 20px;">Create Note</h4>
        <input type="text" name="note" placeholder="Note Name"/>
        <select class="mynotebooks"></select>
        <button onclick="addUpdateNote($('[name=\'note\']').val(),$('#NewNote .mynotebooks').find(':selected').val())" style="width: 100%; justify-content: center;"><i class="fa fa-plus"></i> Create</button>
    </div>
</div>

<div class="main">
    <div id="editor"><p>Start typing your note here...</p></div>
</div>

</body>
</html>
