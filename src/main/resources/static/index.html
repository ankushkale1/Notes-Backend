<html>

<head>
    <meta charset="utf-8"/>
    <link href="css/noty.css" rel="stylesheet">
    <link href="css/topnav.css" rel="stylesheet">
    <link href="css/all.min.css" rel="stylesheet">
    <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
    <link href="css/main.css" rel="stylesheet">
    <link href="css/magnific-popup.css" rel="stylesheet">
    <link href="css/page.css" rel="stylesheet">
    <link rel="stylesheet" href="css/balloon.min.css">
    <link rel="stylesheet" href="css/default.min.css">

    <style>
        /* Make the Top Navbar Sticky */
        .navbar-primary {
            position: sticky !important;
            top: 0;
            z-index: 1050 !important; /* Must be higher than the Quill toolbar (1000) */
            margin-bottom: 0 !important; /* Removes default Bootstrap spacing below the nav */
            width: 100%;
        }

        .ql-toolbar.ql-snow {
            position: sticky;
            top: 50px; /* Adjust this value if your top nav overlaps the toolbar */
            z-index: 1000;
            background-color: #fff; /* Ensures the text behind it doesn't bleed through */
            border-top: 1px solid #ccc;
        }

        /* Global Loader Overlay */
        #app-loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(18, 18, 18, 0.85); /* Dark semi-transparent background */
            z-index: 9999; /* Ensures it stays on top of everything including modals */
            display: none; /* Hidden by default */
            justify-content: center;
            align-items: center;
            color: #e0e0e0;
        }

        .loader-content {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
    </style>

    <style>

        /* Premium Monochrome Dark Theme - Pure Blacks & Grays */
        :root {
            --bg-main: #0a0a0a;        /* Pitch black background */
            --bg-surface: #141414;     /* Slightly elevated charcoal for nav/sidebar */
            --bg-hover: #262626;       /* Hover shade */
            --border-color: #262626;   /* Subtle structural borders */
            --border-focus: #525252;   /* Gray focus ring */
            --text-main: #ededed;      /* Crisp white for readability */
            --text-muted: #888888;     /* Gray for inactive icons/text */
            --accent: #ffffff;         /* Pure white for active states */
            --btn-primary: #262626;    /* Dark button */
            --btn-hover: #404040;      /* Lighter dark button hover */
        }

        body, html {
            background-color: var(--bg-main) !important;
            color: var(--text-main) !important;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        /* --- Top Navbar --- */
        .navbar-primary {
            background-color: var(--bg-surface) !important;
            border-bottom: 1px solid var(--border-color) !important;
            position: sticky !important;
            top: 0;
            z-index: 1050 !important;
            margin-bottom: 0 !important;
            width: 100%;
        }
        .navbar-nav { display: flex !important; flex-direction: row !important; align-items: center; margin: 0; }
        .navbar-nav > li { float: none !important; margin-left: 5px; }
        .navbar-right { float: right !important; margin-right: 20px; }
        .navbar-inverse .navbar-nav > li > a {
            color: var(--text-muted) !important;
            display: flex; align-items: center; gap: 8px;
            transition: all 0.2s ease;
            border-radius: 6px; padding: 10px 15px !important;
        }
        .navbar-inverse .navbar-nav > li > a:hover {
            color: var(--accent) !important;
            background-color: var(--bg-hover) !important;
        }

        /* --- Modern Sidebar --- */
        .modern-sidebar {
            position: fixed;
            top: 51px; /* Height of the top navbar */
            left: 0;
            width: 260px;
            height: calc(100vh - 51px);
            background-color: var(--bg-surface);
            border-right: 1px solid var(--border-color);
            overflow-y: auto;
            z-index: 1040;
        }
        .sidebar-header {
            padding: 20px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .sidebar-menu { padding: 10px 0; }
        .sidebar-menu ul { list-style: none; padding: 0; margin: 0; }
        .sidebar-menu a {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            color: var(--text-muted);
            text-decoration: none !important;
            font-size: 15px;
            transition: all 0.2s ease;
        }
        .sidebar-menu a .menu-item-content { display: flex; align-items: center; gap: 12px; }
        .sidebar-menu a i { font-size: 14px; width: 16px; text-align: center; }

        /* Sidebar Hover & Active States */
        .sidebar-menu a:hover {
            background-color: var(--bg-hover);
            color: var(--text-main);
        }
        .sidebar-menu li.active > a {
            color: var(--accent);
            font-weight: 600;
        }
        .folder-item.active > a { border-left: 3px solid var(--accent); }

        /* Sub-menu styling */
        .sub-menu { background-color: var(--bg-main); }
        .sub-menu a { padding: 8px 20px 8px 45px; font-size: 14px; }
        .sub-menu li.active > a {
            background-color: var(--bg-hover);
            color: var(--accent);
            border-left: 3px solid var(--accent);
        }

        /* --- Main Content Area --- */
        .main {
            margin-left: 260px; /* Offsets content past the sidebar */
            padding: 30px;
            transition: all 0.3s;
        }

        /* --- Modals & Popups --- */
        .white-popup {
            background: var(--bg-surface) !important;
            padding: 30px; border-radius: 8px; max-width: 400px; margin: 0 auto;
            color: var(--text-main) !important; border: 1px solid var(--border-color) !important;
        }
        .white-popup input[type="text"], .white-popup select {
            background-color: var(--bg-main) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--border-color) !important;
            width: 100%; padding: 10px; margin-bottom: 20px; border-radius: 4px;
        }
        .white-popup input[type="text"]:focus, .white-popup select:focus {
            border-color: var(--border-focus) !important; outline: none;
        }

        /* --- Buttons --- */
        button {
            background-color: var(--btn-primary) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--border-color) !important;
            margin: 2px;
            padding: 8px 16px; border-radius: 4px; font-weight: 500; cursor: pointer; transition: 0.2s ease;
        }
        button:hover { background-color: var(--btn-hover) !important; color: var(--accent) !important; }

        /* --- Quill Editor UI --- */
        #editor {
            background-color: var(--bg-main) !important;
            color: var(--text-main) !important;
            border: 1px solid var(--border-color) !important;
            border-top: none !important; border-radius: 0 0 8px 8px; min-height: 70vh;
        }
        .ql-toolbar.ql-snow {
            background-color: var(--bg-surface) !important;
            border: 1px solid var(--border-color) !important;
            border-radius: 8px 8px 0 0; position: sticky; top: 51px; z-index: 1000; padding: 12px !important;
        }
        .ql-snow .ql-stroke { stroke: var(--text-muted) !important; }
        .ql-snow .ql-fill { fill: var(--text-muted) !important; }
        .ql-snow .ql-picker { color: var(--text-muted) !important; }
        button.ql-active .ql-stroke, .ql-snow .ql-picker-label:hover .ql-stroke, .ql-snow .ql-picker-item:hover .ql-stroke { stroke: var(--accent) !important; }
        button.ql-active .ql-fill, .ql-snow .ql-picker-label:hover .ql-fill, .ql-snow .ql-picker-item:hover .ql-fill { fill: var(--accent) !important; }
        .ql-snow .ql-picker-options { background-color: var(--bg-surface) !important; border-color: var(--border-color) !important; }

    </style>
    <script src="js/jquery-3.4.0.min.js"></script>
    <script src="js/highlight.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>

    <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>

    <script src="js/ui.js"></script>
    <script src="js/page.js"></script>
    <script src="js/topbar.js"></script>
    <script src="js/uri.js"></script>
    <script src="js/jquery.magnific-popup.min.js"></script>
    <script src="js/image-drop.min.js"></script>
    <script src="js/magic_url.js"></script>
    <script src="js/noty.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/turndown@7.1.1/dist/turndown.min.js"></script>
</head>

<body>
<div id="app-loader">
    <div class="loader-content">
        <i class="fa fa-spinner fa-spin fa-3x fa-fw"></i>
        <h4 id="loader-text">Loading...</h4>
    </div>
</div>
<nav class="navbar navbar-inverse navbar-primary" style="margin-left: 30px;">
    <div class="navbar-header">
        <button type="button" class="navbar-toggle collapsed" data-toggle="collapse"
                data-target="#bs-example-navbar-collapse-2" aria-expanded="false">
            <span class="sr-only">Toggle navigation</span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
            <span class="icon-bar"></span>
        </button>
    </div>
    <div class="collapse navbar-collapse" id="bs-example-navbar-collapse-2">
        <ul class="nav navbar-nav navbar-right">

            <li class="dropdown">
                <a class="dropdown-toggle" data-toggle="dropdown" style="font-size: 18px;" role="button"
                   aria-haspopup="true" aria-expanded="false">
                    <label id="currentNotebook"></label>
                </a>
            </li>
            <li class="dropdown">
                <a class="dropdown-toggle" data-toggle="dropdown" style="font-size: 18px;" role="button"
                   aria-haspopup="true" aria-expanded="false">
                    <span class="fa fa-arrow-right"></span>
                </a>
            </li>
            <li class="dropdown">
                <a class="dropdown-toggle" data-toggle="dropdown" style="font-size: 18px;" role="button"
                   aria-haspopup="true" aria-expanded="false">
                    <label id="notename">My Note</label>
                </a>
            </li>

            <li class="dropdown">
                <a aria-label="Refresh" data-balloon-pos="down" style="font-size: 18px;" onclick="getNoteBookMeta()"
                   class="dropdown-toggle" data-toggle="dropdown" role="button" aria-haspopup="true"
                   aria-expanded="false">
                    <i class="fa fa-refresh" role="presentation"></i>
                    <span class="small-scn-menu-text">Refresh</span>
                </a>
            </li>

            <li class="dropdown">
                <a aria-label="New Note" data-balloon-pos="down" style="font-size: 18px;" href="#NewNote"
                   class="dropdown-toggle mypopup" data-toggle="dropdown" role="button" aria-haspopup="true"
                   aria-expanded="false">
                    <i class="fa fa-sticky-note" role="presentation"></i><span
                        class="small-scn-menu-text">New Note</span>
                </a>
            </li>

            <li class="dropdown">
                <a href="#NewBook" aria-label="New Notebook" data-balloon-pos="down" style="font-size: 18px;"
                   class="dropdown-toggle mypopup" data-toggle="dropdown" role="button" aria-haspopup="true"
                   aria-expanded="false">
                    <i class="fa fa-book" role="presentation"></i><span class="small-scn-menu-text">New Notebook</span>
                </a>
            </li>

            <li class="dropdown">
                <a onclick="addUpdateNote()" aria-label="Save" data-balloon-pos="down" style="font-size: 18px;"
                   class="dropdown-toggle" data-toggle="dropdown" role="button" aria-haspopup="true"
                   aria-expanded="false">
                    <i class="fa fa-save" role="presentation"></i><span class="small-scn-menu-text">Save</span>
                </a>
            </li>

            <li class="dropdown">
                <a href="#search" aria-label="Search" data-balloon-pos="down" style="font-size: 18px;"
                   onclick="clearPrevSearch()" class="dropdown-toggle mypopup" data-toggle="dropdown" role="button"
                   aria-haspopup="true" aria-expanded="false">
                    <i class="fa fa-search" role="presentation"></i><span class="small-scn-menu-text">Search</span>
                </a>
            </li>
        </ul>
    </div>
</nav>

<aside>
    <nav class="navbar navbar-inverse sidebar navbar-fixed-top" role="navigation">
        <div class="nav-side-menu">
            <div class="brand">Notebooks</div>
            <i class="fa fa-bars fa-2x toggle-btn" data-toggle="collapse" data-target="#menu-content"></i>

            <div class="menu-list">

                <ul id="menu-content" class="menu-content collapse out">
                    <li data-toggle="collapse" data-target="#products" class="collapsed active">
                        <a href="#"><i class="fa fa-sticky-note fa-lg"></i> Notes
                            <i class="fa fa-remove fa-lg btn pull-right" style="margin-top:5px"></i>
                        </a>
                    </li>
                    <ul class="sub-menu collapse" id="products">
                        <li class="active"><a href="#">CSS3 Animation</a></li>
                        <li><a href="#">General</a></li>
                        <li><a href="#">Buttons</a></li>
                        <li><a href="#">Tabs & Accordions</a></li>
                        <li><a href="#">Typography</a></li>
                        <li><a href="#">FontAwesome</a></li>
                        <li><a href="#">Slider</a></li>
                        <li><a href="#">Panels</a></li>
                        <li><a href="#">Widgets</a></li>
                        <li><a href="#">Bootstrap Model</a></li>
                    </ul>
                </ul>
            </div>
        </div>
    </nav>
</aside>

<div>
    <div id="NewBook" class="white-popup mfp-hide">
        <input type="text" name="book" placeholder="Notebook Name"/>
        <select class="mynotebooks" style="color: black">
            <option>Notebook 1</option>
            <option>Notebook 2</option>
            <option>Notebook 3</option>
        </select>
        <button onclick="addNotebook($('[name=\'book\']').val(),$('#NewBook .mynotebooks').find(':selected').val())">
            Create
        </button>
    </div>

    <div id="search" class="white-popup mfp-hide">
        <input type="text" name="stxt" placeholder="Type to search" onkeypress="search()"/>
        <div id="search-content">

        </div>
    </div>

    <div id="NewNote" class="white-popup mfp-hide">
        <input type="text" name="note" placeholder="Note Name"/>
        <select class="mynotebooks" style="color: black">
            <option>Notebook 1</option>
            <option>Notebook 2</option>
            <option>Notebook 3</option>
        </select>
        <button onclick="addUpdateNote($('[name=\'note\']').val(),$('#NewNote .mynotebooks').find(':selected').val())">
            Create
        </button>
    </div>
</div>

<button onclick="exportToMarkdown()" style="margin: 1rem; float: right;">Export to Markdown
</button>

<div class="main">
    <div>
        <div id="editor" style="font-size: 20px;">
            <p>Hello World!</p>
        </div>
    </div>
</div>

</body>

</html>
